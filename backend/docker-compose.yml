services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      GMI_REDIS_URL: redis://redis:6379/0
      GMI_CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      GMI_ALPHA_VANTAGE_API_KEY: ${GMI_ALPHA_VANTAGE_API_KEY:-}
      GMI_ALPHA_VANTAGE_INTRADAY_ENABLED: ${GMI_ALPHA_VANTAGE_INTRADAY_ENABLED:-true}
      GMI_ALPHA_VANTAGE_MIN_REQUEST_INTERVAL_SECONDS: ${GMI_ALPHA_VANTAGE_MIN_REQUEST_INTERVAL_SECONDS:-1.1}
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    command: redis-server --save 60 1 --loglevel warning
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
