[project]
name = "global-market-index-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "redis>=5.0,<7.0",
  "pydantic>=2.8,<3.0",
  "httpx>=0.27,<1.0",
  "websockets>=13.0,<16.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 88
target-version = "py311"
